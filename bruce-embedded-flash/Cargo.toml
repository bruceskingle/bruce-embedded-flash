[package]
name = "bruce-embedded-flash"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Flashes firmware built on bruce-embedded-std to a board, only if it was built for that board."
repository = "https://github.com/bruceskingle/bruce-embedded-flash"
readme = "README.md"

[dependencies]
anyhow = "1"
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
espflash = { version = "4.2", default-features = false, features = ["serialport"] }
serialport = { version = "4.7", default-features = false }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }

# The record each firmware image carries, from the repository next to this one.
bruce-embedded-firmware-record = "0.1.0"
bruce-embedded-firmware = { version = "0.1.0", path = "../bruce-embedded-firmware" }
